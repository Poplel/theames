[package]
name = "theames"
version = "1.1.1"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
dirs = "7.0.0"
futures-util = "0.3.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "time", "sync", "process"] }
tokio-tungstenite = "0.30.0"
ureq = "3.4.2"
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }

[profile.release]
lto = true
codegen-units = 1
strip = true

[target.'cfg(target_os = "macos")'.dependencies]
dispatch2 = "0.3"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSRunningApplication", "NSWorkspace", "NSImage", "NSAlert", "NSTextField", "NSControl", "NSView", "NSAttributedString", "NSGraphics", "NSPanel", "NSWindow", "NSButton", "NSEvent"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["NSAttributedString", "NSDate", "NSDictionary", "NSError", "NSGeometry", "NSObject", "NSRunLoop", "NSString", "NSURL", "std"] }
objc2-service-management = { version = "0.3", default-features = false, features = ["std", "SMAppService", "objc2", "objc2-foundation"] }

[target."cfg(windows)".dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
